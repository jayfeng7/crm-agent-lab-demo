name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          for file in public/*.js; do
            node --check "$file"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
